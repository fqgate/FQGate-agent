name: Agent 插件持续集成

on:
  workflow_dispatch:
  push:
    branches: [main, V2]
  pull_request:
    branches: [main, V2]

permissions:
  contents: read

concurrency:
  group: fqgate-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: 插件集成与发行包测试
    runs-on: windows-2025
    steps:
      - name: 检出仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 安装编排器依赖
        shell: pwsh
        run: npm --prefix installer ci
      - name: 运行集成测试
        shell: pwsh
        run: |
          npm test
          node --test examples/trading-demo/tests/submission-state.test.mjs
          $env:PYTHONPATH = (Resolve-Path sdk/python/src)
          python -m unittest discover -s sdk/python/tests -p 'test_*.py'
          python -m unittest discover -s scripts/release -p 'test_*.py'
      - name: 构建正式插件包
        shell: pwsh
        run: ./scripts/Build-AgentPlugins.ps1 -Release

  mcp-apps:
    name: MCP Apps 构建和签名合同测试
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI-plugins/ui-apps/package-lock.json
      - name: 安装 UI 依赖
        run: npm --prefix AI-plugins/ui-apps ci
      - name: 运行 MCP Apps 测试
        run: npm --prefix AI-plugins/ui-apps run test:mcp-apps
      - name: 验证仓库中的正式 MCP Apps 签名
        run: |
          version=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('AI-plugins/ui-apps/mcp-apps/apps.json')).bundleVersion)")
          node AI-plugins/ui-apps/scripts/verify-mcp-apps-release.mjs \
            --release-root fqgate/mcp-apps \
            --public-key-file fqgate/mcp-apps/mcp-apps-ed25519-public.pem \
            --version "$version"
